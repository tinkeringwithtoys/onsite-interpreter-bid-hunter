# =============================================================================
# TIER 3 of 3  ·  HEAVY LANE  ·  Playwright / real browser
# =============================================================================
# Runs HOURLY, 24/7. The repo went PUBLIC on 2026-08-08, so Actions minutes
# are unlimited and the browser lane no longer needs to ration itself.
#
# Why a browser lane exists at all: some portals cannot be read by plain HTTP
# from a datacenter runner. Proven 2026-08-08 (see audit notes in config.yaml):
#   ungm    - internal search endpoints 500 on cookie-less POSTs (ASP.NET)
#   afdb    - Cloudflare 403 'Just a moment...'
#   frontex - hard 403 Forbidden
#   tuneps  - parked until its login/certificate path is confirmed
#
# Why not EVERYTHING in a browser, even with unlimited minutes: browsers are
# the most fragile layer (selectors break, challenges, hangs). Sources proven
# server-rendered stay on plain HTTP -- cheaper AND more reliable, and cost is
# no longer the reason either way. Cheapest tool that can read the source.
#
# This lane also carries the KEEPALIVE: GitHub disables scheduled workflows
# after 60 days of repo inactivity, and it is not safe to assume bot commits
# reset that timer.
# =============================================================================

name: heavy (browser, hourly)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bid-hunter-heavy
  cancel-in-progress: false

jobs:
  browse:
    runs-on: ubuntu-latest
    timeout-minutes: 15      # browser installs are slow; still far below the 360 default

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Playwright + Chromium
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Scrape browser-only sources
        env:
          LANE: heavy
          TUNEPS_USER: ${{ secrets.TUNEPS_USER }}
          TUNEPS_PASSWORD: ${{ secrets.TUNEPS_PASSWORD }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python scraper.py --tier heavy

      # Screenshots on failure. When a selector breaks six weeks from now you
      # will have no idea why without seeing what the page actually looked like.
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: heavy-debug-${{ github.run_id }}
          path: |
            debug/*.png
            debug/*.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Keepalive + commit state
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "bid-hunter[bot]"
          git config user.email "bid-hunter@users.noreply.github.com"

          mkdir -p .keepalive
          date -u +%FT%TZ > .keepalive/last_run

          for f in seen.json watchlist.json data.json .keepalive/last_run; do
            [ -f "$f" ] && git add "$f"
          done

          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi
          git commit -m "state: heavy poll + keepalive $(date -u +%FT%TZ)"

          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              break
            fi
            echo "rebase attempt ${attempt} failed, retrying"
            sleep 5
          done

          git push origin "HEAD:${GITHUB_REF_NAME}"

      # SILENCE IS AMBIGUOUS. Without this, a crashed lane and a quiet week
      # look identical in the inbox.
      - name: Report failure
        if: failure()
        env:
          LANE: heavy
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scraper.py --notify-failure "heavy tier failed"
