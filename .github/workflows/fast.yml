# =============================================================================
# TIER 1 of 3  ·  FAST LANE  ·  JSON APIs only
# =============================================================================
# Runs EVERY HOUR, 24/7, all week. This is the "always on" lane.
#
# It is affordable because it only touches JSON APIs (TED, EU Funding &
# Tenders). No browser, no Playwright, no Chromium download. A run is seconds.
#
# Budget: 730 runs/month x 1 billed minute = ~730 min of a 2,000 min free
# private-repo allowance. See README for the full budget table.
#
# Want to halve it? Change the cron to '0 */2 * * *'. Nothing in public
# procurement is minute-sensitive, so that costs you nothing real.
# =============================================================================

name: fast (JSON APIs, hourly)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write          # enough to commit state. A personal access token is NOT needed.

concurrency:
  group: bid-hunter-fast
  cancel-in-progress: false   # never kill a run mid-write; queue instead

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5      # default is 360. One hang would burn 18% of the month.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5     # NOT actions/actions-setup-python - that does not exist
        with:
          python-version: '3.12'          # NOT python-with-version - not a valid input

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Poll JSON APIs
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python scraper.py --tier fast

      - name: Commit state
        run: |
          set -euo pipefail
          git config user.name  "bid-hunter[bot]"
          git config user.email "bid-hunter@users.noreply.github.com"

          # Only commit if something actually changed. Committing an unchanged
          # or EMPTY data file over good data is a real failure mode.
          if [ -z "$(git status --porcelain seen.json watchlist.json data.json 2>/dev/null)" ]; then
            echo "No state change - nothing to commit."
            exit 0
          fi

          for f in seen.json watchlist.json data.json; do
            [ -f "$f" ] && git add "$f"
          done
          git commit -m "state: fast poll $(date -u +%FT%TZ)"

          # Rebase before pushing: another tier may have pushed while we ran.
          # Retry, because a lost push means duplicate alerts next run.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              break
            fi
            echo "rebase attempt ${attempt} failed, retrying"
            sleep 5
          done

          # No '|| true' here on purpose. A failed push must fail the run and
          # show up as a red X, not disappear silently.
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # SILENCE IS AMBIGUOUS. Without this, a crashed lane and a quiet week
      # look identical in the inbox.
      - name: Report failure
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scraper.py --notify-failure "fast tier failed"
