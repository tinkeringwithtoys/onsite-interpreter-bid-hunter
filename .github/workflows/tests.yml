# =============================================================================
# CI  ·  offline self-tests
# =============================================================================
# Everything here is offline. No secrets, no network, no LLM calls.
# It only runs when code, config, or workflow definitions change; state commits
# alone do not trigger CI.
# =============================================================================

name: tests (offline self-tests)

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'config.yaml'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bid-hunter-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check every module
        run: python -m compileall -q .

      - name: scraper self-test
        run: python scraper.py --self-test

      - name: source health self-test
        run: python source_health.py --self-test

      - name: notify self-test
        run: python notify.py --self-test

      - name: envfile self-test
        run: python envfile.py --self-test

      - name: deadline_watch self-test
        run: python deadline_watch.py --self-test

      - name: urlnorm self-test
        run: python urlnorm.py --self-test

      - name: config integrity
        run: python validate_sources.py --check-config

      - name: unified Hunt parity
        run: python check_workflows.py

      # CI failures are separate from normal procurement-source health.
      - name: Report failure
        if: failure() && github.event_name == 'push'
        env:
          LANE: all
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scraper.py --notify-failure "tests failed"
