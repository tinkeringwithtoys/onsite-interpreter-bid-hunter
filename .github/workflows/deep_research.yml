name: Deep Research

on:
  schedule:
    # Twice daily: 06:00 and 18:00 UTC
    - cron: "0 6,18 * * *"
  workflow_dispatch:  # manual trigger from Actions tab

permissions:
  contents: write  # needed to commit reports

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Deep Research
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python deep_research.py

      - name: Commit reports
        run: |
          git config user.name "Deep Research Bot"
          git config user.email "actions@github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "Deep Research — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
