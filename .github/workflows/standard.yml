# =============================================================================
# TIER 2 of 3  ·  STANDARD LANE  ·  plain HTTP scrapes + DEADLINE WATCH
# =============================================================================
# Runs 3x daily, every day: 06:00 / 12:00 / 17:00 Tunis.
# (Tunis is UTC+1 year-round with no DST, so these local times never drift.)
#
# Two jobs here, and the second one is the one that was missing entirely:
#
#   poll    - HTTP scrapes of the P1 sources (UNGM, UNDP, AU, AfDB, EUAA,
#             Frontex, PLACE, BOAMP). Answers "what is NEW?"
#
#   watch   - Deadline milestones on already-parked items. Answers "what is
#             about to CLOSE?" Running hourly would NOT have fixed this; a
#             new-notice pipeline never re-surfaces a tender it already saw.
#
# Budget: ~91 runs/month x 2 billed min = ~182 min.
# =============================================================================

name: standard (HTTP + deadline watch)

on:
  schedule:
    - cron: '0 5,11,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bid-hunter-standard
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape P1 HTTP sources
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python scraper.py --tier standard

      # This step needs no network and no secrets, so it cannot fail for
      # connectivity reasons. It is pure date arithmetic over watchlist.json.
      - name: Deadline watch (T-14 / T-7 / T-3 / T-1)
        id: deadlines
        run: python deadline_watch.py --watchlist watchlist.json

      - name: Commit state
        run: |
          set -euo pipefail
          git config user.name  "bid-hunter[bot]"
          git config user.email "bid-hunter@users.noreply.github.com"

          if [ -z "$(git status --porcelain seen.json watchlist.json data.json 2>/dev/null)" ]; then
            echo "No state change - nothing to commit."
            exit 0
          fi

          for f in seen.json watchlist.json data.json; do
            [ -f "$f" ] && git add "$f"
          done
          git commit -m "state: standard poll $(date -u +%FT%TZ)"

          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              break
            fi
            echo "rebase attempt ${attempt} failed, retrying"
            sleep 5
          done

          git push origin "HEAD:${GITHUB_REF_NAME}"

      # SILENCE IS AMBIGUOUS. A broken workflow and "no new opportunities"
      # look identical in your inbox. This makes failure loud.
      - name: Report failure
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scraper.py --notify-failure "standard tier failed"
