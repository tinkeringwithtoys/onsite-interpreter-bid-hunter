# =============================================================================
# GLOBAL INTERPRETER BID HUNTER · unified two-hour pass
# =============================================================================
# One workflow. Every source that is explicitly poll:true. Every two hours.
#
# Why keep one job instead of Fast / Standard / Heavy:
# - The repository is public, so GitHub-hosted Actions minutes are unlimited.
# - A source should not wait for a different lane just because it needs a
#   browser. Chromium is installed once, then APIs, static portals, browser
#   pages, and open-web discovery all flow through one dedupe/scoring/digest.
# - One state writer prevents the three-lane race where simultaneous jobs can
#   rebase over seen.json, watchlist.json or data.json.
#
# Scope: every source with poll:true in config.yaml. poll:false sources stay
# deliberately parked: a schedule cannot replace TUNEPS credentials/certificates
# or make a duplicate source produce new notices.
# =============================================================================

name: Hunt — all enabled sources (every 2 hours)

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bid-hunter-all
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    # The scorer receives up to 53.5 minutes (55 minus the safety margin).
    # This protects the state commit and failure email from being killed mid-run.
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python and browser dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Hunt every enabled source
        env:
          LANE: all
          TUNEPS_USER: ${{ secrets.TUNEPS_USER }}
          TUNEPS_PASSWORD: ${{ secrets.TUNEPS_PASSWORD }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python run_hunt.py

      - name: Deadline watch
        run: python deadline_watch.py --watchlist watchlist.json

      - name: Upload browser/debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hunt-debug-${{ github.run_id }}
          path: |
            debug/*.png
            debug/*.html
            debug/last_error.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit state
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "bid-hunter[bot]"
          git config user.email "bid-hunter@users.noreply.github.com"

          for f in seen.json watchlist.json data.json; do
            [ -f "$f" ] && git add "$f"
          done

          if git diff --cached --quiet; then
            echo "No state change - nothing to commit."
            exit 0
          fi

          git commit -m "state: unified hunt $(date -u +%FT%TZ)"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              break
            fi
            echo "rebase attempt ${attempt} failed, retrying"
            sleep 5
          done
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report failure
        if: failure()
        env:
          LANE: all
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scraper.py --notify-failure "unified hunt failed"
